<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" type="image/png" href="/appicon.png" />
    <title>Page not found · limiterdB</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..600&display=swap" />
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; box-sizing: border-box;
        background: #000; color: #fafafa; font-family: Geist, ui-sans-serif, sans-serif; text-align: center;
      }
      main { display: flex; flex-direction: column; align-items: center; gap: 24px; max-width: 480px; }
      .line { width: 160px; height: 4px; border-radius: 999px; background: oklch(83% 0.165 85); }
      h1 { margin: 0; font-size: 36px; line-height: 40px; font-weight: 600; letter-spacing: -0.025em; text-wrap: balance; }
      p { margin: 0; color: #a3a3a3; font-size: 18px; line-height: 28px; text-wrap: pretty; }
      a {
        display: inline-flex; padding: 8px 12px; border-radius: 8px; background: oklch(83% 0.165 85); color: #000;
        font-size: 16px; line-height: 24px; font-weight: 600; text-decoration: none;
        transition: transform 200ms cubic-bezier(0.22, 1, 0.36, 1);
      }
      a:active { transform: scale(0.98); }
      a:focus-visible { outline: 2px solid oklch(83% 0.165 85); outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/appicon.png" alt="limiterdB app icon" width="64" height="64" />
      <h1>This page went over the limit.</h1>
      <div class="line" aria-hidden="true"></div>
      <p>The address you followed doesn't exist on this site.</p>
      <a href="/">Back to limiterdB</a>
    </main>
  </body>
</html>
